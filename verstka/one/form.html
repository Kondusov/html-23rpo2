<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    input{
        display: block;
    }
    form p{
        display: flex;
    }
    form p input{
        display: inline; 
    }
</style>
<body>
    <form action="#"><!--  action="https://www.google.com/search"-->
        <input type="text" name="q" placeholder="Введите для поиска">
        <label for="name">Enter your name: </label>
        <input type="text" minlength="2" name="user_name" placeholder="Введите имя">
        <input type="number" name="age" max="20" placeholder="*">
        <input type="email" value="example@sd.com">
        <input type="password">
        <textarea name="" id="" rows="5" cols="40"></textarea>
        <label for="">Выберите класс
            <select name="select_class" id="">
                <option value="1">первый</option>
                <option value="2">второй</option>
                <option value="3" selected>третий</option>
            </select>
        </label>
        <P>
        <label for="radio">Выберите вариант 1
            <input type="radio" name="radio" value="1">
        </label>
        </P>
        <P>
        <label for="radio"><input type="radio" name="radio" value="2">
             Выберите вариант 2
            
        </label>
        </P>
        <P>
        <label for="radio">Выберите вариант 3
            <input type="radio" name="radio" value="3">
        </label>
        </P>
        <input type="range" name="progress" step="10">
        <input type="datetime-local">
        <input type="color" value="#e70d0d">
        <input type="file" accept="text/txt">
        <input type="checkbox" checked required>
        <input type="submit" value="Обработать">
    </form>
    <section>Lorem ipsum dolor sit amet consectetur adipisicing elit. Provident quod necessitatibus adipisci dolorem vero ipsum saepe laboriosam dignissimos, quam facere vel velit magnam sunt dicta ut deserunt recusandae, harum accusamus?<p id="footer">Это элемент для якоря</p></section>
</body>
</html>
